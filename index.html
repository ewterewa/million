<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МОЙ МИЛЛИОН ВОЗМОЖНОСТЕЙ — канал 1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tv-frame">
  <div class="tv-screen">
    <div class="scanlines"></div>
    <div class="noise"></div>
    <div class="vignette"></div>

    <div class="content">
      <div class="channel-info">
        <span class="channel-num" id="channelNum">КАНАЛ 1</span>
        <span class="rec-dot"></span>
        <span class="rec-text">ЗАПИСЬ</span>
      </div>

      <div class="slide" id="slide">
        <h1 id="slideTitle">МОЙ МИЛЛИОН<br>ВОЗМОЖНОСТЕЙ</h1>
        <p id="slideText">Итоговый проект по финансовой грамотности<br>Выполнил: [Фамилия Имя], 11 класс</p>
      </div>

      <div class="controls">
        <button class="btn" id="prevBtn">◀ КАНАЛ</button>
        <button class="btn" id="nextBtn">КАНАЛ ▶</button>
      </div>

      <div class="footer">
        <span>СССР • ЭЛЕКТРОН • 1987</span>
        <span id="timer">00:00:00</span>
      </div>
    </div>
  </div>

  <div class="tv-knobs">
    <div class="knob"></div>
    <div class="knob"></div>
    <div class="speaker">
      <div></div><div></div><div></div><div></div><div></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
